# Development. Staging and production use fly.staging.toml / fly.production.toml.
#
# Core has no [http_service] on purpose: it is reached only over 6PN private
# networking (<app>.internal) by the gateway, never from the public internet.
# That also means the Fly proxy never auto-stops it, so there is no cold start
# on the playback path.
app = "cindral-atlas-core-dev"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ATLAS_BIND_ADDR = "[::]:3000"
  # Stamped into the stream URLs handed to players, so it must name the
  # gateway for THIS environment.
  ATLAS_PUBLIC_BASE_URL = "https://cindral-atlas-gateway-dev.fly.dev"
  # Shown when a viewer picks a source TorBox has not cached yet: selecting one
  # queues it, and there is nothing to play for about thirty seconds. Unset, the
  # player gets a 503 and shows a generic failure. Point this at a short MP4
  # saying "preparing, try again shortly" and the wait explains itself.
  ATLAS_PLACEHOLDER_VIDEO_URL = ""
  # Development only for now. Staging and production deliberately leave this
  # unset, so they mount no Jellyfin routes at all.
  ATLAS_JELLYFIN_ENABLED = "1"
  # TEMPORARY, for discovery only — remove once the route list settles.
  #
  # Every endpoint here was inferred from documentation rather than observed,
  # and a single 404 stops a client mid-flow, so gaps surface one per deploy.
  # With this on, unknown routes answer 200 with an empty body instead, letting
  # a real client run to completion and record the whole list in one session.
  #
  # It also lets core fall back to its own preferences when the gateway is not
  # in the path. That is safe here only because core has no public listener —
  # it is reachable solely over 6PN from the gateway — and it is the reason
  # this must not follow the surface to staging or production.
  ATLAS_JELLYFIN_PERMISSIVE = "1"
