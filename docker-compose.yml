version: '3.8'

services:
  core:
    build:
      context: ./core
    ports:
      - "3000:3000"
    environment:
      - ATLAS_BIND_ADDR=0.0.0.0:3000
      - ATLAS_PUBLIC_BASE_URL=http://127.0.0.1:8080
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:54321}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gateway:
    build:
      context: ./gateway
    ports:
      - "8080:8080"
    environment:
      - ATLAS_CORE_URL=http://core:3000
    depends_on:
      - core

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "8000:8000"
    environment:
      - PUBLIC_SUPABASE_URL=${SUPABASE_URL:-http://127.0.0.1:54321}
      - PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - PUBLIC_GATEWAY_URL=http://127.0.0.1:8080
    depends_on:
      - gateway

# Note: For the database, run `supabase start` in the root of the repository.
# Then set the SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY environment variables when running `docker-compose up`.
