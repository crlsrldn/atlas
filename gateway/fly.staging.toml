app = "cindral-atlas-gateway-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ATLAS_CORE_URL = "http://cindral-atlas-core-staging.internal:3000"
  ATLAS_DASHBOARD_URL = "https://cindral-atlas-dashboard-staging.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
