app = "cindral-atlas-gateway-dev"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ATLAS_CORE_URL = "http://cindral-atlas-core-dev.internal:3000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
