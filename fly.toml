app = "cindral-atlas-api-dev"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ATLAS_BIND_ADDR = "0.0.0.0:3000"
  ATLAS_ENV = "development"
  ATLAS_PUBLIC_BASE_URL = "https://cindral-atlas-api-dev.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
