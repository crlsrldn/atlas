[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1.19"
tower-http = { version = "0.5", features = ["cors"] }
async-trait = "0.1"
futures = "0.3.32"
appwrite = "0.7.0"
dotenvy = "0.15"
chrono = "0.4.45"
