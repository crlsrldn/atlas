name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - staging
      - production
      - main
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Optional Fly environment to deploy"
        required: false
        type: choice
        options:
          - none
          - dev
          - staging
          - production
        default: none

jobs:
  core:
    name: Rust Core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  gateway:
    name: Go Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...

  dashboard:
    name: Deno Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Check
        run: deno check main.ts

  smoke:
    name: API smoke contract
    runs-on: ubuntu-latest
    needs: [core, gateway]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Start services
        run: |
          cd core && ATLAS_BIND_ADDR=127.0.0.1:3000 cargo run --bin backend > /tmp/atlas-core.log 2>&1 &
          echo $! > /tmp/atlas-core.pid
          cd ../gateway && go build && ./atlas-gateway > /tmp/atlas-gateway.log 2>&1 &
          echo $! > /tmp/atlas-gateway.pid
          
          # Wait for services to start
          sleep 10
      - name: Check manifest
        run: curl -fsS http://127.0.0.1:8080/stremio/demo-install-token/manifest.json
      - name: Stop services
        if: always()
        run: |
          if [ -f /tmp/atlas-core.pid ]; then kill "$(cat /tmp/atlas-core.pid)" || true; fi
          if [ -f /tmp/atlas-gateway.pid ]; then kill "$(cat /tmp/atlas-gateway.pid)" || true; fi

  deploy-dev:
    name: Deploy dev
    runs-on: ubuntu-latest
    needs: [smoke, dashboard]
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'dev') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: |
          # Normally this would deploy multi-process or multiple apps. 
          echo "Deploying dev..."
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
