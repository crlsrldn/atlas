name: CI

on:
  pull_request:
  push:
    branches:
      - development
      - staging
      - production
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Optional Fly environment to deploy"
        required: false
        type: choice
        options:
          - none
          - development
          - staging
          - production
        default: none

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build

  container:
    name: Container
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t atlas-backend:${{ github.sha }} .

  smoke:
    name: API smoke contract
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Start backend
        run: |
          cargo run --bin backend > /tmp/atlas-backend.log 2>&1 &
          echo $! > /tmp/atlas-backend.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:3000/health && exit 0
            sleep 1
          done
          cat /tmp/atlas-backend.log
          exit 1
      - name: Check hosted manifest
        run: curl -fsS http://127.0.0.1:3000/stremio/demo-install-token/manifest.json
      - name: Check invalid install token rejection
        run: |
          status=$(curl -s -o /tmp/invalid.json -w "%{http_code}" http://127.0.0.1:3000/stremio/bad-token/manifest.json)
          test "$status" = "404"
      - name: Check tenant-scoped mock resolver path
        run: ../scripts/smoke.sh http://127.0.0.1:3000
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/atlas-backend.pid ]; then
            kill "$(cat /tmp/atlas-backend.pid)" || true
          fi

  deploy-development:
    name: Deploy development
    runs-on: ubuntu-latest
    needs:
      - container
      - smoke
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'development') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/development')
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy development
        run: flyctl deploy -c fly.toml --app "${{ vars.FLY_DEV_APP || 'cindral-atlas-api-dev' }}" --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke development
        run: ./scripts/smoke.sh "https://${{ vars.FLY_DEV_APP || 'cindral-atlas-api-dev' }}.fly.dev"

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs:
      - container
      - smoke
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'staging') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy staging
        run: flyctl deploy -c fly.staging.toml --app "${{ vars.FLY_STAGING_APP || 'cindral-atlas-api-staging' }}" --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke staging
        run: ./scripts/smoke.sh "https://${{ vars.FLY_STAGING_APP || 'cindral-atlas-api-staging' }}.fly.dev"

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - container
      - smoke
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.deploy_environment == 'production') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/production')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy production
        run: flyctl deploy -c fly.production.toml --app "${{ vars.FLY_PRODUCTION_APP || 'cindral-atlas-api' }}" --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke production
        run: ./scripts/smoke.sh "https://${{ vars.FLY_PRODUCTION_APP || 'cindral-atlas-api' }}.fly.dev"
